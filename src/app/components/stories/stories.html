@if (testimonials().length) {
  <section class="section-pad stories" id="temoignages" aria-labelledby="reviews-title">
    <div class="container">
      <h2 id="reviews-title" appReveal>{{ language.text('Témoignages', 'Testimonials') }}</h2>
      <div class="cards">
        @for (item of testimonials(); track item._id) {
          <figure appReveal><blockquote>{{ language.text(item.textFr, item.textEn) }}</blockquote><figcaption>{{ item.author }}</figcaption></figure>
        }
      </div>
    </div>
  </section>
}
@if (photos().length) {
  <section class="section-pad gallery" id="parcours-en-images" aria-labelledby="gallery-title">
    <div class="container">
      <h2 id="gallery-title" appReveal>{{ language.text('Parcours en images', 'Journey in pictures') }}</h2>
      <div class="cards">
        @for (item of photos(); track item._id) {
          <figure appReveal>
            <button type="button" (click)="photoDialog.showModal()" [attr.aria-label]="language.text('Agrandir : ', 'Enlarge: ') + language.text(item.titleFr, item.titleEn)">
              <img [src]="item.imageUrl" [alt]="language.text(item.titleFr, item.titleEn)" loading="lazy" decoding="async">
            </button>
            <figcaption>{{ language.text(item.titleFr, item.titleEn) }}</figcaption>
            <dialog #photoDialog [attr.aria-label]="language.text(item.titleFr, item.titleEn)">
              <form method="dialog"><button autofocus>{{ language.text('Fermer', 'Close') }} ×</button></form>
              <img [src]="item.imageUrl" [alt]="language.text(item.titleFr, item.titleEn)" loading="lazy">
              <p>{{ language.text(item.textFr, item.textEn) }}</p>
            </dialog>
          </figure>
        }
      </div>
    </div>
  </section>
}
